name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - name: Syntax checks
        run: |
          for file in app/*.js integration/*.js scripts/*.cjs service/*.js; do node --check "$file"; done
          for file in integration/*.sh scripts/tv-ssh; do sh -n "$file"; done
